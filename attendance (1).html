<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>हाज़िरी मैनेजर</title><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6fa;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--pr:#2563eb;--bd:#e5e7eb;--ok:#16a34a;--rd:#dc2626}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--tx:#eef0f5;--mu:#9aa3b2;--pr:#5b8cff;--bd:#2a3140}}
:root[data-theme="dark"]{--bg:#10131a;--card:#1a1f2b;--tx:#eef0f5;--mu:#9aa3b2;--pr:#5b8cff;--bd:#2a3140}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
.w{max-width:640px;margin:auto;padding:12px}.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px;margin:4px 0}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--pr);color:#fff;font-size:15px;margin:3px 3px 3px 0}
button.g{background:var(--ok)}button.r{background:var(--rd)}button.s{background:var(--mu)}
.t{display:flex;gap:6px;margin-bottom:10px}.t button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.t button.a{background:var(--pr);color:#fff}.t button{padding:10px 2px;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}.mu{color:var(--mu);font-size:14px}h2{margin:4px 0 10px;font-size:20px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
.x{overflow-x:auto}
</style></head><body><div class="w" id="app"></div><script>
var D={pw:"",staff:[],att:{}},tab="h",login=false;
try{var s=localStorage.getItem("att_v1");if(s)D=JSON.parse(s)}catch(e){}
if(!D.set)D.set={rate:30,mode:"hour"};if(!D.adj)D.adj={};
function save(){try{localStorage.setItem("att_v1",JSON.stringify(D))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date();return d.toISOString().slice(0,7)==="x"?"":new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
var curDate=today(),curMonth=today().slice(0,7);
function mins(i,o,l){if(!i||!o)return 0;var a=i.split(":"),b=o.split(":");var m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);m=m<0?m+1440:m;var L=D.feat&&D.feat.lunch===false?0:((l===""||l==null)?(+D.set.lunch||0):+l);return Math.max(0,m-L)}
function fmt(m){return Math.floor(m/60)+" घंटे "+m%60+" मिनट"}
function rec(d,id){return(D.att[d]&&D.att[d][id])||{i:"",o:""}}
function render(){var a=$("app");
if(!login){a.innerHTML=loginHtml();return}if(0){var set=0;a.innerHTML='<div class="c" style="margin-top:40px"><h2>🔐 हाज़िरी मैनेजर</h2><p class="mu">'+(set?"नया अकाउंट बनाएं":"लॉगिन करें")+'</p><input id="un" placeholder="यूज़रनेम"><input id="pw" type="password" placeholder="पासवर्ड">'+(set?'<input id="q" placeholder="सीक्रेट सवाल (जैसे: पहले स्कूल का नाम?)"><input id="ans" placeholder="सवाल का जवाब">':'')+'<button onclick="doLogin()">'+(set?"अकाउंट बनाएं":"लॉगिन")+'</button>'+(set?'':'<button class="s" onclick="forgot()">पासवर्ड भूल गए?</button>')+'</div>';return}
var h='<div class="t"><button class="'+(tab=="h"?"a":"")+'" onclick="tab=\'h\';render()">हाज़िरी</button><button class="'+(tab=="s"?"a":"")+'" onclick="tab=\'s\';render()">स्टाफ</button><button class="'+(tab=="v"?"a":"")+'" onclick="tab=\'v\';render()">वेतन/रिपोर्ट</button><button class="'+(tab=="g"?"a":"")+'" onclick="tab=\'g\';render()">सेटिंग</button><button class="'+(tab=="a"?"a":"")+'" onclick="goAdmin()">एडमिन</button></div>';
if(tab=="h")h+=hajiri();else if(tab=="s")h+=staffTab();else if(tab=="g")h+=settings();else if(tab=="a")h+=adminTab();else h+=report();
h+='<button class="s" onclick="login=false;render()">लॉगआउट</button><button class="s" onclick="chpw()">पासवर्ड बदलें</button>';a.innerHTML=h}
function doLogin(){var u=$("un").value.trim(),p=$("pw").value;if(!u||!p){alert("यूज़रनेम और पासवर्ड भरें");return}
if(!(D.pw&&D.user)){var q=$("q").value.trim(),an=$("ans").value.trim().toLowerCase();if(!q||!an){alert("सीक्रेट सवाल और जवाब भरें");return}D.user=u;D.pw=p;D.q=q;D.a=an;save();login=true}
else if(u===D.user&&p===D.pw)login=true;else{alert("गलत यूज़रनेम या पासवर्ड");return}render()}
function forgot(){if(!D.q){alert("रिकवरी सेट नहीं है");return}var r=prompt("सीक्रेट सवाल: "+D.q);if(r===null)return;if(r.trim().toLowerCase()!==D.a){alert("जवाब गलत है");return}var p=prompt("नया पासवर्ड डालें");if(p){D.pw=p;save();alert("पासवर्ड बदल गया। अब लॉगिन करें।")}}
function chpw(){var p=prompt("नया पासवर्ड");if(p){D.pw=p;save();alert("पासवर्ड बदल गया")}}
function hajiri(){var h='<div class="c"><h2>तारीख चुनें</h2><input type="date" value="'+curDate+'" onchange="curDate=this.value;render()"></div>';
if(!D.staff.length)return h+'<div class="c mu">पहले "स्टाफ" टैब में स्टाफ जोड़ें।</div>';
D.staff.forEach(function(s){var r=rec(curDate,s.id);h+='<div class="c"><b>'+esc(s.name)+'</b><div class="row"><div><span class="mu">इन टाइम</span><input type="time" value="'+r.i+'" onchange="setT(\''+s.id+'\',\'i\',this.value)"></div><div><span class="mu">आउट टाइम</span><input type="time" value="'+r.o+'" onchange="setT(\''+s.id+'\',\'o\',this.value)"></div></div><div id="tot'+s.id+'" class="mu">कुल काम: '+(r.i&&r.o?fmt(mins(r.i,r.o,lunchOf(r))):"—")+'</div></div>'});return h}
function setT(id,k,v){if(!D.att[curDate])D.att[curDate]={};if(!D.att[curDate][id])D.att[curDate][id]={i:"",o:""};D.att[curDate][id][k]=v;save();var r=D.att[curDate][id];$("tot"+id).textContent="कुल काम: "+(r.i&&r.o?fmt(mins(r.i,r.o,lunchOf(r))):"—")}
function staffTab(){var h='<div class="c"><h2>स्टाफ जोड़ें</h2><input id="n" placeholder="नाम"><input id="m" type="tel" placeholder="मोबाइल नंबर (10 अंक)"><input id="sl" type="number" placeholder="मासिक वेतन (₹) — ज़रूरी नहीं"><input id="rt" type="number" placeholder="प्रति घंटा रेट (₹) — खाली = डिफ़ॉल्ट"><button onclick="addS()">जोड़ें</button></div>';
D.staff.forEach(function(s){h+='<div class="c"><b>'+esc(s.name)+'</b><div class="mu">📱 '+esc(s.mob)+' · रेट ₹'+rateOf(s)+'/घंटा · मासिक ₹'+(s.sal||0)+'</div><button onclick="editS(\''+s.id+'\')">✏️ एडिट</button><button class="r" onclick="delS(\''+s.id+'\')">हटाएं</button></div>'});return h}
function addS(){var n=$("n").value.trim(),m=$("m").value.trim(),sl=+$("sl").value||0,rt=$("rt").value.trim();if(!n||!m){alert("नाम और मोबाइल भरें");return}D.staff.push({id:"s"+Date.now(),name:n,mob:m,sal:sl,rate:rt===""?"":+rt});save();render()}
function delS(id){if(confirm("स्टाफ हटाएं?")){D.staff=D.staff.filter(function(s){return s.id!==id});save();render()}}
function stats(s){var dim=new Date(+curMonth.slice(0,4),+curMonth.slice(5),0).getDate(),days=0,tm=0,rows=[];
for(var d=1;d<=dim;d++){var ds=curMonth+"-"+(d<10?"0"+d:d),r=rec(ds,s.id);if(r.i||r.o){var m=mins(r.i,r.o,lunchOf(r));if(r.i&&r.o){days++;tm+=m}rows.push([ds,r.i,r.o,m])}}
return{days:days,tm:tm,rows:rows,pay:calc(s,days,tm,dim),dim:dim}}
function report(){var h='<div class="c"><h2>महीना चुनें</h2><input type="month" value="'+curMonth+'" onchange="curMonth=this.value;render()"></div>';
D.staff.forEach(function(s){var st=stats(s);h+='<div class="c"><b>'+esc(s.name)+'</b> <span class="mu">📱 '+esc(s.mob)+'</span><div>हाज़िर: '+st.days+' दिन · कुल: '+fmt(st.tm)+'</div><div>'+(D.set.mode=="hour"?"रेट ₹"+rateOf(s)+"/घंटा":"मासिक वेतन ₹"+(s.sal||0))+(D.adj[curMonth+s.id]?" · एडजस्ट ₹"+D.adj[curMonth+s.id]:"")+' → <b>बनता है: ₹'+st.pay+'</b> · <b>बाकी: ₹'+payInfo(s,st).bal+'</b></div>';
h+='<div class="x"><table><tr><th>तारीख</th><th>इन</th><th>आउट</th><th>कुल</th><th>₹ रकम</th></tr>';
st.rows.forEach(function(r){h+='<tr><td>'+r[0].split("-").reverse().join("/")+'</td><td>'+(r[1]||"—")+'</td><td>'+(r[2]||"—")+'</td><td>'+(r[1]&&r[2]?fmt(r[3]):"—")+'</td><td>'+(r[1]&&r[2]?"₹"+dayPay(s,r[3],st):"—")+'</td></tr>'});
h+=totRow(s,st)+'</table></div><button onclick="addPay(\''+s.id+'\',\'a\')">➕ एडवांस</button><button onclick="addPay(\''+s.id+'\',\'p\')">💵 पेमेंट मिली</button><button class="s" onclick="adj(\''+s.id+'\')">± बोनस/कटौती</button><button class="g" onclick="send(\''+s.id+'\',\'w\')">WhatsApp भेजें</button><button onclick="send(\''+s.id+'\',\'s\')">SMS भेजें</button></div>'});
return h}
function rateOf(s){return s.rate!==""&&s.rate!=null?+s.rate:+D.set.rate}
function calc(s,days,tm,dim){var b=D.set.mode=="hour"?Math.round(tm/60*rateOf(s)):Math.round((s.sal||0)/dim*days);return b+(+D.adj[curMonth+s.id]||0)}
function editS(id){var s=D.staff.filter(function(x){return x.id===id})[0];var n=prompt("नाम",s.name);if(n===null)return;var m=prompt("मोबाइल नंबर",s.mob);if(m===null)return;var sl=prompt("मासिक वेतन (₹)",s.sal||0);if(sl===null)return;var r=prompt("प्रति घंटा रेट (₹) — खाली छोड़ें तो डिफ़ॉल्ट ₹"+D.set.rate,s.rate===""||s.rate==null?"":s.rate);if(r===null)return;s.name=n.trim()||s.name;s.mob=m.trim()||s.mob;s.sal=+sl||0;s.rate=r.trim()===""?"":+r;save();render()}
function adj(id){var k=curMonth+id,v=prompt("बोनस (+) या कटौती (−) की रकम ₹",D.adj[k]||0);if(v===null)return;D.adj[k]=+v||0;save();render()}
function settings(){return'<div class="c"><h2>⚙️ सेटिंग</h2><span class="mu">वेतन का तरीका</span><div class="t"><button class="'+(D.set.mode=="hour"?"a":"")+'" onclick="setMode(\'hour\')">घंटे के हिसाब से</button><button class="'+(D.set.mode=="month"?"a":"")+'" onclick="setMode(\'month\')">मासिक वेतन</button></div><span class="mu">डिफ़ॉल्ट रेट प्रति घंटा (₹)</span><input id="dr" type="number" value="'+D.set.rate+'"><span class="mu">डिफ़ॉल्ट लंच टाइम (मिनट) — हर दिन के कुल समय से कटेगा</span><input id="dl" type="number" value="'+(D.set.lunch||0)+'"><button onclick="saveRate()">सेव करें</button><p class="mu">किसी स्टाफ का अलग रेट चाहिए तो स्टाफ टैब में ✏️ एडिट दबाएं।</p></div>'}
function setMode(m){D.set.mode=m;save();render()}
function saveRate(){var v=+$("dr").value;if(!(v>=0)){alert("सही रेट डालें");return}D.set.rate=v;D.set.lunch=+$("dl").value||0;save();alert("सेव हो गया")}
window.alert=function(m){var d=document.createElement("div");d.textContent=m;d.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:12px;border-radius:10px;z-index:99;text-align:center";document.body.appendChild(d);setTimeout(function(){d.remove()},2500)};
var modal=null,delPend=null;
function ask(t,f,cb){modal={t:t,f:f,cb:cb};render()}
function modalHtml(){var h='<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px"><div class="c" style="width:100%;max-width:420px;margin:0;max-height:90%;overflow:auto"><h2>'+modal.t+'</h2>';modal.f.forEach(function(f,i){h+='<span class="mu">'+esc(f.l)+'</span><input id="mf'+i+'" type="'+(f.type||"text")+'" value="'+esc(f.v==null?"":f.v)+'">'});return h+'<button onclick="modalOk()">सेव करें</button><button class="s" onclick="modal=null;render()">रद्द करें</button></div></div>'}
function modalOk(){var v=modal.f.map(function(f,i){return $("mf"+i).value});var cb=modal.cb;modal=null;cb(v)}
var _r=render;render=function(){_r();if(modal)$("app").insertAdjacentHTML("beforeend",modalHtml())};
function staffTab(){var h='<div class="c"><h2>स्टाफ जोड़ें</h2><input id="n" placeholder="नाम"><input id="m" type="tel" placeholder="मोबाइल नंबर (10 अंक)"><input id="sl" type="number" placeholder="मासिक वेतन (₹) — ज़रूरी नहीं"><input id="rt" type="number" placeholder="प्रति घंटा रेट (₹) — खाली = डिफ़ॉल्ट ₹'+D.set.rate+'"><button onclick="addS()">जोड़ें</button></div>';
D.staff.forEach(function(s){var hr=s.rate===""||s.rate==null;h+='<div class="c"><b>'+esc(s.name)+'</b> <span class="mu">📱 '+esc(s.mob)+'</span><div class="mu">अभी का रेट: ₹'+rateOf(s)+'/घंटा'+(hr?" (डिफ़ॉल्ट)":"")+'</div><span class="mu">इस स्टाफ का प्रति घंटा रेट (₹)</span><div class="row"><input id="r'+s.id+'" type="number" value="'+(hr?"":s.rate)+'" placeholder="डिफ़ॉल्ट ₹'+D.set.rate+'"><button onclick="saveRateS(\''+s.id+'\')">रेट सेव</button></div>'+cfStaffInputs(s)+'<button onclick="editS(\''+s.id+'\')">✏️ एडिट</button><button class="r" onclick="delS(\''+s.id+'\')">'+(delPend===s.id?"पक्का हटाएं?":"हटाएं")+'</button></div>'});return h}
function saveRateS(id){var s=D.staff.filter(function(x){return x.id===id})[0],v=$("r"+id).value.trim();s.rate=v===""?"":+v;save();alert("रेट सेव हो गया");render()}
function editS(id){var s=D.staff.filter(function(x){return x.id===id})[0];ask("स्टाफ एडिट",[{l:"नाम",v:s.name},{l:"मोबाइल नंबर",type:"tel",v:s.mob},{l:"मासिक वेतन (₹)",type:"number",v:s.sal||0},{l:"प्रति घंटा रेट (₹) — खाली = डिफ़ॉल्ट",type:"number",v:s.rate==null?"":s.rate}],function(v){s.name=v[0].trim()||s.name;s.mob=v[1].trim()||s.mob;s.sal=+v[2]||0;s.rate=v[3].trim()===""?"":+v[3];save();alert("सेव हो गया");render()})}
function delS(id){if(delPend===id){D.staff=D.staff.filter(function(s){return s.id!==id});delPend=null;save();alert("हटा दिया")}else{delPend=id;alert("पक्का हटाने के लिए दोबारा दबाएं")}render()}
function adj(id){var k=curMonth+id;ask("बोनस / कटौती",[{l:"रकम ₹ (+ बोनस, − कटौती)",type:"number",v:D.adj[k]||0}],function(v){D.adj[k]=+v[0]||0;save();render()})}
function chpw(){ask("पासवर्ड बदलें",[{l:"नया पासवर्ड",type:"password",v:""}],function(v){if(v[0]){D.pw=v[0];save();alert("पासवर्ड बदल गया")}render()})}
function forgot(){if(!D.q){alert("रिकवरी सेट नहीं है");return}ask("पासवर्ड रिकवरी",[{l:"सीक्रेट सवाल: "+D.q,v:""}],function(v){if(v[0].trim().toLowerCase()!==D.a){alert("जवाब गलत है");render();return}ask("नया पासवर्ड",[{l:"नया पासवर्ड",type:"password",v:""}],function(w){if(w[0]){D.pw=w[0];save();alert("पासवर्ड बदल गया। अब लॉगिन करें।")}render()})})}
function to12(t){if(!t)return{v:"",p:"AM"};var a=t.split(":"),h=+a[0];return{v:(h%12||12)+":"+a[1],p:h>=12?"PM":"AM"}}
function tfield(id,k,r){var x=to12(r[k]);return'<input id="'+k+id+'" placeholder="जैसे 9:30" value="'+x.v+'" onchange="setT2(\''+id+'\',\''+k+'\')"><div class="row"><select id="'+k+'p'+id+'" style="padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px" onchange="setT2(\''+id+'\',\''+k+'\')"><option'+(x.p=="AM"?" selected":"")+'>AM</option><option'+(x.p=="PM"?" selected":"")+'>PM</option></select><button onclick="nowT(\''+id+'\',\''+k+'\')">अभी</button></div>'}
function p2(n){return(n<10?"0":"")+n}
function setT2(id,k){var s=$(k+id).value.trim().toLowerCase(),p=$(k+"p"+id).value;if(s===""){setT(id,k,"");render();return}
var pm=/p/.test(s),am=/a/.test(s);s=s.replace(/[apm\s]/g,"").replace(/[.\-]/g,":");var h,m;
if(s.indexOf(":")>-1){var q=s.split(":");h=+q[0];m=+q[1]||0}else if(s.length>2){h=+s.slice(0,-2);m=+s.slice(-2)}else{h=+s;m=0}
if(isNaN(h)||isNaN(m)||h>23||m>59){alert("सही समय लिखें, जैसे 9:30");render();return}
if(pm)p="PM";if(am)p="AM";if(h>0&&h<=12){if(h==12)h=p=="AM"?0:12;else if(p=="PM")h+=12}
setT(id,k,p2(h)+":"+p2(m));render()}
function nowT(id,k){var d=new Date();setT(id,k,p2(d.getHours())+":"+p2(d.getMinutes()));render()}

function lunchView(s){if(D.feat.lunch===false)return"";var r=rec(curDate,s.id),m=lm(r),t="";if(r.ls&&r.le){var a=to12(r.ls),b=to12(r.le);t=a.v+" "+a.p+" – "+b.v+" "+b.p+" · "}return'<div class="mu">🍽️ लंच: '+t+((m===""||m==null)?(D.set.lunch||0):m)+' मिनट</div>'}
function setLunch(id,v){if(isLocked(curDate,id)){alert("यह हाज़िरी सेव हो चुकी है");return}if(!D.att[curDate])D.att[curDate]={};if(!D.att[curDate][id])D.att[curDate][id]={i:"",o:""};var x=D.att[curDate][id];x.l=v===""?"":+v;save();var t=$("tot"+id);if(t)t.textContent="कुल काम: "+(x.i&&x.o?fmt(mins(x.i,x.o,lunchOf(x))):"—")}
function rawm(i,o){var a=i.split(":"),b=o.split(":");var m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);return m<0?m+1440:m}
function lunchOf(r){if(r.ls&&r.le)return rawm(r.ls,r.le);return r.l==null?"":r.l}
function t12(t){var x=to12(t);return x.v+" "+x.p}
function lunchInp(s){if(D.feat.lunch===false)return"";var r=rec(curDate,s.id);return'<div class="row"><div><span class="mu">🍽️ लंच शुरू</span>'+tfield(s.id,"ls",r)+'</div><div><span class="mu">🍽️ लंच खत्म</span>'+tfield(s.id,"le",r)+'</div></div><span class="mu">या लंच मिनट में (टाइम न भरें तो)</span><input type="number" value="'+(r.l==null?"":r.l)+'" placeholder="डिफ़ॉल्ट '+(D.set.lunch||0)+'" onchange="setLunch(\''+s.id+'\',this.value)">'}
function lunchView(s){if(D.feat.lunch===false)return"";var r=rec(curDate,s.id),L=lunchOf(r);return'<div class="mu">🍽️ लंच: '+(r.ls&&r.le?t12(r.ls)+" से "+t12(r.le)+" · ":"")+((L===""||L==null)?(D.set.lunch||0):L)+' मिनट</div>'}
function send(id,t){var s=D.staff.filter(function(x){return x.id===id})[0],st=stats(s);
var pd=payInfo(s,st);var msg="नमस्ते "+s.name+", "+curMonth.slice(5)+"/"+curMonth.slice(0,4)+" की हाज़िरी: "+st.days+" दिन, कुल काम "+fmt(st.tm)+". कुल वेतन: ₹"+st.pay+(pd.a?", एडवांस: ₹"+pd.a:"")+(pd.p?", पेमेंट मिली: ₹"+pd.p:"")+", बाकी: ₹"+pd.bal+". धन्यवाद।";
var n=s.mob.replace(/\D/g,"");if(n.length==10)n="91"+n;
var u=t=="w"?"https://wa.me/"+n+"?text="+encodeURIComponent(msg):"sms:+"+n+"?body="+encodeURIComponent(msg);var el=document.createElement("a");el.href=u;el.target="_blank";el.rel="noopener";document.body.appendChild(el);el.click();el.remove()}
render();
</script></body></html>
